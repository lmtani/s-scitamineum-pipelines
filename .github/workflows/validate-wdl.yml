name: Validate WDL Workflows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-wdl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Download Womtool
        run: |
          # Specify whichever Womtool release you'd like:
          WOMTOOL_VERSION="88"
          wget "https://github.com/broadinstitute/cromwell/releases/download/${WOMTOOL_VERSION}/womtool-${WOMTOOL_VERSION}.jar" -O womtool.jar

      - name: Validate WDL files
        shell: bash
        run: |
          # For each WDL in the repository root, find a matching JSON in the inputs/ directory
          for WDL in *.wdl; do
            BASENAME=$(basename "$WDL" .wdl)
            JSON="inputs/${BASENAME}.inputs.json"

            if [ -f "$JSON" ]; then
              echo "Validating $WDL with $JSON"
              java -jar womtool.jar validate -i "$JSON" "$WDL"
            else
              echo "No matching inputs file found for $WDL, skipping..."
            fi
          done
